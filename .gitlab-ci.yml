stages:
  - build
  - test
  - deploy

variables:
  APP_NAME: app

build_job:
  stage: build
  script:
    - echo "Работаю..."
    - mkdir build
    - echo "Завершено..."

test_job:
  stage: test
  script:
    - echo "Тестирование..."
    - echo "Tests passed"

deploy_job:
  stage: deploy
  script:
    - echo "Настройка программы..."
    - echo "Deployment complete"
  only:
    - main